name: Daily Digest

on:
  schedule:
    - cron: '0 0,12 * * *'   # 08:00 and 20:00 Taiwan time (UTC+8)
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily digest (web-only, no email)
        run: python digest.py --preview

      - name: Commit digest HTML for web tab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/digest-latest.html
          if git diff --cached --quiet; then
            echo "No digest HTML change to commit."
            exit 0
          fi
          git commit -m "chore: update digest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Workflow runs ~15 min; rebase before push to survive any
          # concurrent commits that landed on main during the run.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying after 5s..."
            sleep 5
          done
          echo "all push attempts failed"
          exit 1
