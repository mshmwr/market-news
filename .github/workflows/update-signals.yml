name: Update Signals

on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 UTC+8 (Taiwan) daily
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Space-separated tickers (leave blank for all)'
        required: false
        default: 'NVDA TSLA LWLG SNDK LITE PLTR AAPL GOOGL MSFT AMZN TSM AMD ASML INTC META BTC-USD ETH-USD SPY QQQ SOXX ^GSPC ^VIX 2308.TW 2454.TW'
      bundle_date:
        description: 'Load cached bundles from this date (YYYY-MM-DD). Leave blank to fetch fresh data.'
        required: false
        default: ''

concurrency:
  group: signals-push
  cancel-in-progress: false   # queue, do not cancel an in-progress run

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal analysis
        run: |
          TICKERS="${{ github.event.inputs.tickers || 'NVDA TSLA LWLG SNDK LITE PLTR AAPL GOOGL MSFT AMZN TSM AMD ASML INTC META BTC-USD ETH-USD SPY QQQ SOXX ^GSPC ^VIX 2308.TW 2454.TW' }}"
          BUNDLE_DATE="${{ github.event.inputs.bundle_date }}"
          TODAY=$(date -u +%Y-%m-%d)
          if [ -n "$BUNDLE_DATE" ]; then
            python analyze_stock.py --output-json docs/signals.json \
              --load-bundles docs/bundles/$BUNDLE_DATE $TICKERS
          else
            python analyze_stock.py --output-json docs/signals.json \
              --save-bundles docs/bundles/$TODAY $TICKERS
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/signals.json docs/bundles/
          git diff --staged --quiet || git commit -m "chore: update signals $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
