<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日市場新聞</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d1d1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="市場新聞">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    #updated { font-size: 12px; color: #999; }
    #translate-btn {
      font-size: 12px; padding: 4px 10px; border-radius: 14px;
      border: 1.5px solid #ccc; background: #fff; cursor: pointer;
      color: #555; white-space: nowrap;
    }
    #refresh-btn, #signals-refresh-btn {
      font-size: 12px; padding: 4px 8px; border-radius: 14px;
      border: 1.5px solid #ccc; background: #fff; cursor: pointer;
      color: #555; white-space: nowrap;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #refresh-btn.loading, #signals-refresh-btn.loading { pointer-events: none; opacity: .6; }
    #refresh-btn .spinner, #signals-refresh-btn .spinner {
      display: none; width: 14px; height: 14px;
      border: 2px solid #ddd; border-top-color: #555;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle;
    }
    #refresh-btn.loading .icon, #signals-refresh-btn.loading .icon { display: none; }
    #refresh-btn.loading .spinner, #signals-refresh-btn.loading .spinner { display: inline-block; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; font-size: 13px; padding: 10px 18px;
      border-radius: 20px; opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 100; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* --- Tabs --- */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
      color: #555; transition: all .15s;
    }
    .tab-btn:hover { border-color: #888; }
    .tab-btn.active { background: #1d1d1f; color: #fff; border-color: transparent; }

    /* --- Filters (news tab only) --- */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filters[hidden] { display: none; }
    .signal-cat-filters[hidden] { display: none; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; color: #1d1d1f; font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .filter-btn:hover { border-color: #888; }
    .filter-btn.active { color: #fff; border-color: transparent; }

    /* --- Signal action filter (BUY / HOLD / SELL) --- */
    #signal-action-filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .sig-action-btn {
      padding: 5px 14px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; color: #1d1d1f; font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .sig-action-btn:hover { border-color: #888; }
    .sig-action-btn[data-action="all"].active  { background: #1d1d1f; color: #fff; border-color: transparent; }
    .sig-action-btn[data-action="BUY"].active  { background: #2e7d32; color: #fff; border-color: transparent; }
    .sig-action-btn[data-action="HOLD"].active { background: #f57f17; color: #fff; border-color: transparent; }
    .sig-action-btn[data-action="SELL"].active { background: #c62828; color: #fff; border-color: transparent; }
    .filter-btn[data-cat="全部"].active       { background: #1d1d1f; }
    .filter-btn[data-cat="台股"].active       { background: #2e7d32; }
    .filter-btn[data-cat="美股"].active       { background: #1565c0; }
    .filter-btn[data-cat="加密貨幣"].active   { background: #e65100; }
    .filter-btn[data-cat="宏觀"].active       { background: #6a1b9a; }

    main { max-width: 800px; margin: 24px auto; padding: 0 16px; }

    #status { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }

    .news-list { display: flex; flex-direction: column; gap: 1px; background: #e0e0e0; border-radius: 12px; overflow: hidden; }

    .news-item { background: #fff; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
    .news-item:hover { background: #fafafa; }

    .news-item a { font-size: 15px; font-weight: 500; color: #1d1d1f; text-decoration: none; line-height: 1.4; }
    .news-item a:hover { color: #0071e3; }

    .news-meta { display: flex; gap: 8px; align-items: center; }

    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
    .badge-source   { background: #f0f0f0; color: #555; }
    .badge-台股     { background: #e8f5e9; color: #2e7d32; }
    .badge-美股     { background: #e3f2fd; color: #1565c0; }
    .badge-加密貨幣 { background: #fff3e0; color: #e65100; }
    .badge-宏觀     { background: #f3e5f5; color: #6a1b9a; }

    .news-time { font-size: 12px; color: #999; margin-left: auto; white-space: nowrap; }

    /* --- Signals section --- */
    #signals-section { margin-bottom: 24px; }
    .signals-header {
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px;
    }
    .signals-title { font-size: 16px; font-weight: 600; color: #1d1d1f; }
    #signals-updated { font-size: 12px; color: #999; }
    #signals-placeholder { font-size: 14px; color: #888; padding: 16px 0; }
    .sort-btn {
      font-size: 11px; padding: 3px 10px; border-radius: 14px;
      border: 1.5px solid #ccc; background: #fff; cursor: pointer; color: #555;
    }
    .sort-btn.active { border-color: #888; color: #1d1d1f; font-weight: 500; }
    .signals-hint { font-size: 11px; color: #aaa; margin: 0 0 10px; line-height: 1.5; }
    .signal-cat-filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .sig-filter-btn {
      padding: 4px 12px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; font-size: 12px; cursor: pointer; color: #555; transition: all .15s;
    }
    .sig-filter-btn:hover { border-color: #888; }
    .sig-filter-btn.active { background: #1d1d1f; color: #fff; border-color: transparent; }
    .sig-filter-btn.active[data-scat="半導體"] { background: #e3f2fd; color: #1565c0; border-color: #1565c0; }
    .sig-filter-btn.active[data-scat="光電"]   { background: #f3e5f5; color: #6a1b9a; border-color: #6a1b9a; }
    .sig-filter-btn.active[data-scat="電子"]   { background: #fce4ec; color: #880e4f; border-color: #880e4f; }
    .sig-filter-btn.active[data-scat="AI/雲端"] { background: #e8eaf6; color: #283593; border-color: #283593; }
    .sig-filter-btn.active[data-scat="資安"]   { background: #ffebee; color: #c62828; border-color: #c62828; }
    .sig-filter-btn.active[data-scat="EV"]     { background: #e8f5e9; color: #2e7d32; border-color: #2e7d32; }
    .sig-filter-btn.active[data-scat="無人機"] { background: #e0f7fa; color: #00695c; border-color: #00695c; }
    .sig-filter-btn.active[data-scat="加密貨幣"] { background: #fff3e0; color: #e65100; border-color: #e65100; }
    .sig-filter-btn.active[data-scat="ETF"]    { background: #f5f5f5; color: #555; border-color: #888; }
    .sig-filter-btn.active[data-scat="指數"]   { background: #efebe9; color: #4e342e; border-color: #4e342e; }
    .sig-filter-btn.active[data-scat="通訊"]   { background: #e8f4fd; color: #0277bd; border-color: #0277bd; }
    .sig-filter-btn.active[data-scat="原物料"] { background: #fff8e1; color: #f57f17; border-color: #f57f17; }
    .sig-deselect-btn { color: #aaa; border-color: #e0e0e0; }
    .sig-deselect-btn:hover { color: #c62828; border-color: #c62828; }
    .signals-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* Signal cards */
    .signal-card {
      background: #fff; border-radius: 10px; padding: 10px 14px;
      border-left: 4px solid transparent; cursor: pointer;
      min-width: 0;
    }
    .signal-BUY  { border-left-color: #2e7d32; }
    .signal-HOLD { border-left-color: #f9a825; }
    .signal-SELL { border-left-color: #c62828; }

    .signal-summary { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .signal-cat {
      font-size: 10px; padding: 1px 6px; border-radius: 8px;
      white-space: nowrap; flex-shrink: 0; font-weight: 500;
    }
    [data-cat="半導體"] { background: #e3f2fd; color: #1565c0; }
    [data-cat="光電"]   { background: #f3e5f5; color: #6a1b9a; }
    [data-cat="電子"]   { background: #fce4ec; color: #880e4f; }
    [data-cat="AI/雲端"] { background: #e8eaf6; color: #283593; }
    [data-cat="資安"]   { background: #ffebee; color: #c62828; }
    [data-cat="EV"]     { background: #e8f5e9; color: #2e7d32; }
    [data-cat="無人機"] { background: #e0f7fa; color: #00695c; }
    [data-cat="加密貨幣"] { background: #fff3e0; color: #e65100; }
    [data-cat="ETF"]    { background: #f5f5f5; color: #555; }
    [data-cat="指數"]   { background: #efebe9; color: #4e342e; }
    [data-cat="通訊"]   { background: #e8f4fd; color: #0277bd; }
    [data-cat="原物料"] { background: #fff8e1; color: #f57f17; }

    .signal-ticker {
      font-size: 14px; font-weight: 600; color: #1d1d1f;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .signal-confidence { font-size: 12px; color: #555; white-space: nowrap; flex-shrink: 0; }
    .signal-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; white-space: nowrap; flex-shrink: 0;
    }
    .signal-BUY  .signal-badge { background: #e8f5e9; color: #2e7d32; }
    .signal-HOLD .signal-badge { background: #fff8e1; color: #f9a825; }
    .signal-SELL .signal-badge { background: #ffebee; color: #c62828; }

    .signal-details {
      display: none; margin-top: 8px; padding-top: 8px;
      border-top: 1px solid #f0f0f0;
    }
    .signal-card.expanded .signal-details { display: block; }
    .signal-rationale { font-size: 12px; color: #666; line-height: 1.5; margin-bottom: 8px; overflow-wrap: break-word; }

    .signal-sources-title {
      font-size: 11px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
    }
    .signal-source-row { display: flex; align-items: baseline; gap: 6px; line-height: 1.5; }
    .signal-sources a {
      font-size: 11px; color: #0071e3; text-decoration: none;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
    }
    .signal-sources a:hover { text-decoration: underline; }
    .signal-source-date { font-size: 10px; color: #999; white-space: nowrap; flex-shrink: 0; }
    .signal-data-section { margin-bottom: 6px; }
    .signal-data-label {
      font-size: 10px; font-weight: 600; color: #999;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px;
    }
    .signal-data-values { display: flex; flex-wrap: wrap; gap: 4px; }
    .signal-data-item { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: #f0f0f0; color: #555; }

    /* --- Market Overview --- */
    #market-overview {
      background: #fff; border-radius: 12px; padding: 14px 16px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .mkt-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .mkt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .mkt-grid > div:last-child { grid-column: 1 / -1; }
    @media (min-width: 560px) {
      .mkt-grid { grid-template-columns: 1fr 1fr 1fr; }
      .mkt-grid > div:last-child { grid-column: auto; }
    }
    .mkt-section-label { font-size: 10px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .mkt-sentiment-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; margin-bottom: 6px; gap: 2px; }
    .mkt-sentiment-rows, .mkt-indicator-rows, .mkt-cat-rows { display: flex; flex-direction: column; gap: 3px; }
    .mkt-sentiment-row, .mkt-indicator-row, .mkt-cat-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .mkt-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .mkt-indicator-row { justify-content: space-between; }
    .mkt-indicator-name { color: #888; }
    .mkt-indicator-value { font-weight: 600; }
    .mkt-sig-badge { font-size: 10px; padding: 1px 5px; border-radius: 5px; font-weight: 600; }
    .mkt-sig-BUY  { background: #e8f5e9; color: #2e7d32; }
    .mkt-sig-HOLD { background: #fff8e1; color: #f57f17; }
    .mkt-sig-SELL { background: #ffebee; color: #c62828; }
    .mkt-cat-label { width: 52px; color: #555; flex-shrink: 0; }
    .mkt-cat-bar-bg { flex: 1; height: 4px; background: #f0f0f0; border-radius: 2px; }
    .mkt-cat-bar-fill { height: 100%; background: #2e7d32; border-radius: 2px; transition: width .3s; }
    .mkt-cat-count { color: #888; white-space: nowrap; min-width: 28px; text-align: right; }

    /* --- Screener Card --- */
    #screener-card {
      background: #fff; border-radius: 12px; padding: 14px 16px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .screener-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
    .screener-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    .screener-toggle { font-size: 11px; color: #aaa; }
    .screener-item { padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
    .screener-item:last-child { border-bottom: none; }
    .screener-item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .screener-rank { font-size: 11px; color: #aaa; width: 18px; flex-shrink: 0; }
    .screener-ticker { font-size: 13px; font-weight: 600; color: #1d1d1f; }
    .screener-name { font-size: 11px; color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .screener-score { font-size: 11px; font-weight: 600; color: #2e7d32; white-space: nowrap; }
    .screener-reason { font-size: 11px; color: #555; line-height: 1.5; padding-left: 26px; }

    /* --- Feedback --- */
    #feedback-btn {
      position: fixed; bottom: 24px; right: 20px; z-index: 200;
      background: #1d1d1f; color: #fff; border: none; border-radius: 20px;
      padding: 10px 18px; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    #feedback-btn:hover { background: #3a3a3c; }
    #feedback-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300;
      align-items: center; justify-content: center;
    }
    #feedback-overlay.open { display: flex; }
    #feedback-box {
      background: #fff; border-radius: 14px; padding: 24px; width: 90%; max-width: 400px;
      display: flex; flex-direction: column; gap: 12px;
    }
    #feedback-box h3 { font-size: 16px; font-weight: 600; }
    #feedback-box p { font-size: 13px; color: #666; }
    #feedback-text {
      width: 100%; height: 100px; border: 1.5px solid #ccc; border-radius: 8px;
      padding: 10px; font-size: 16px; resize: none; font-family: inherit;
    }
    #feedback-text:focus { outline: none; border-color: #888; }
    .feedback-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .feedback-actions button {
      padding: 8px 18px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; font-size: 13px; cursor: pointer;
    }
    #feedback-submit { background: #1d1d1f; color: #fff; border-color: transparent; }
    #feedback-submit:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>每日市場新聞</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="translate-btn">🌐 翻譯</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="news">📰 新聞</button>
      <button class="tab-btn" data-tab="signals">📈 股票訊號</button>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-cat="全部">全部</button>
      <button class="filter-btn active" data-cat="台股">台股</button>
      <button class="filter-btn active" data-cat="美股">美股</button>
      <button class="filter-btn active" data-cat="加密貨幣">加密貨幣</button>
      <button class="filter-btn active" data-cat="宏觀">宏觀</button>
      <button class="filter-btn" id="deselect-all-btn">全部取消</button>
    </div>
    <div id="signal-cat-filters" class="signal-cat-filters" hidden></div>
  </header>

  <main>
    <section id="signals-section" hidden>
      <div class="signals-header">
        <h2 class="signals-title">股票訊號</h2>
        <button id="signals-refresh-btn" title="更新訊號"><span class="icon">↻</span><span class="spinner"></span></button>
        <button id="sort-btn" class="sort-btn active">信心度 ↓</button>
        <span id="signals-updated"></span>
      </div>
      <div id="signal-action-filters">
        <button class="sig-action-btn active" data-action="all">全部</button>
        <button class="sig-action-btn" data-action="BUY">🟢 BUY</button>
        <button class="sig-action-btn" data-action="HOLD">🟡 HOLD</button>
        <button class="sig-action-btn" data-action="SELL">🔴 SELL</button>
      </div>
      <p class="signals-hint">信心度 = AI 對訊號方向的把握程度（0–100%）；數值越高代表新聞、技術面、基本面指向越一致。點擊卡片可展開詳細數據。</p>
      <div id="market-overview" hidden></div>
      <div id="screener-card" hidden></div>
      <div id="signals-list" class="signals-grid" hidden></div>
      <div id="signals-placeholder" hidden>訊號暫未生成</div>
    </section>
    <section id="news-section">
      <div id="news-controls" style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <button id="refresh-btn" title="重新整理"><span class="icon">↻</span><span class="spinner"></span></button>
        <span id="updated"></span>
      </div>
      <div id="status">載入中…</div>
      <div id="news-list" class="news-list" hidden></div>
    </section>
  </main>
  <div id="toast"></div>

  <script>
    const CATEGORIES = ['台股', '美股', '加密貨幣', '宏觀'];
    const selected = new Set(CATEGORIES);
    let allArticles = [];
    let latestTs = 0;
    let currentTab = 'news';
    let allSignals = [];
    let signalSort = 'desc'; // 'none' | 'desc' | 'asc'

    const TICKER_CATEGORY = {
      'NVDA':'半導體','AMD':'半導體','ASML':'半導體','INTC':'半導體',
      'TSM':'半導體','MU':'半導體','SNDK':'半導體','LWLG':'半導體','2454.TW':'半導體',
      'LITE':'光電','2308.TW':'電子',
      'GOOGL':'AI/雲端','MSFT':'AI/雲端','AMZN':'AI/雲端','META':'AI/雲端','PLTR':'AI/雲端',
      'CRWD':'資安','TSLA':'EV','ONDS':'無人機',
      'BTC-USD':'加密貨幣','ETH-USD':'加密貨幣',
      'SPY':'ETF','QQQ':'ETF','SOXX':'ETF','IBB':'ETF',
      '^GSPC':'指數','^VIX':'指數','^TNX':'指數',
      'NOK':'通訊','CL=F':'原物料',
    };
    const SIG_CATS = [...new Set(Object.values(TICKER_CATEGORY))].sort();
    let selectedSigCats = new Set(SIG_CATS);

    const filterBtns  = document.querySelectorAll('.filter-btn');
    const tabBtns     = document.querySelectorAll('.tab-btn');
    const filtersEl   = document.querySelector('.filters');
    const listEl      = document.getElementById('news-list');
    const statusEl    = document.getElementById('status');
    const updatedEl   = document.getElementById('updated');
    const refreshBtn  = document.getElementById('refresh-btn');
    const signalsRefreshBtn   = document.getElementById('signals-refresh-btn');
    const sigActionBtns       = document.querySelectorAll('.sig-action-btn');
    const deselectAllBtn      = document.getElementById('deselect-all-btn');
    let signalsDate = '';
    let signalActionFilter = 'all';
    const toastEl     = document.getElementById('toast');
    const signalsSectionEl     = document.getElementById('signals-section');
    const newsSectionEl        = document.getElementById('news-section');
    const signalsListEl        = document.getElementById('signals-list');
    const signalsUpdatedEl     = document.getElementById('signals-updated');
    const signalsPlaceholderEl = document.getElementById('signals-placeholder');
    const sortBtn              = document.getElementById('sort-btn');

    sortBtn.addEventListener('click', () => {
      signalSort = signalSort === 'desc' ? 'asc' : signalSort === 'asc' ? 'none' : 'desc';
      sortBtn.className = 'sort-btn' + (signalSort !== 'none' ? ' active' : '');
      sortBtn.textContent = signalSort === 'desc' ? '信心度 ↓' : signalSort === 'asc' ? '信心度 ↑' : '信心度 ↕';
      renderSignals();
    });

    const sigCatFiltersEl = document.getElementById('signal-cat-filters');
    ['全部', ...SIG_CATS].forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'sig-filter-btn active';
      btn.dataset.scat = cat;
      btn.textContent = cat;
      sigCatFiltersEl.appendChild(btn);
    });
    const deselectBtn = document.createElement('button');
    deselectBtn.className = 'sig-filter-btn sig-deselect-btn';
    deselectBtn.dataset.scat = '取消全選';
    deselectBtn.textContent = '取消全選';
    sigCatFiltersEl.appendChild(deselectBtn);

    sigCatFiltersEl.addEventListener('click', e => {
      const btn = e.target.closest('.sig-filter-btn');
      if (!btn) return;
      const cat = btn.dataset.scat;
      if (cat === '全部') {
        SIG_CATS.forEach(c => selectedSigCats.add(c));
      } else if (cat === '取消全選') {
        selectedSigCats.clear();
      } else {
        selectedSigCats.has(cat) ? selectedSigCats.delete(cat) : selectedSigCats.add(cat);
      }
      updateSigFilterBtns();
      renderSignals();
    });
    function updateSigFilterBtns() {
      const allOn = SIG_CATS.every(c => selectedSigCats.has(c));
      sigCatFiltersEl.querySelectorAll('.sig-filter-btn').forEach(btn => {
        const cat = btn.dataset.scat;
        if (cat === '取消全選') return;
        btn.classList.toggle('active', cat === '全部' ? allOn : selectedSigCats.has(cat));
      });
    }

    function renderSignals() {
      signalsListEl.innerHTML = '';
      let signals = allSignals.filter(s => selectedSigCats.has(TICKER_CATEGORY[s.ticker] || ''));
      if (signalActionFilter !== 'all') signals = signals.filter(s => s.signal === signalActionFilter);
      if (signalSort === 'desc') signals.sort((a, b) => b.confidence - a.confidence);
      if (signalSort === 'asc')  signals.sort((a, b) => a.confidence - b.confidence);
      signals.forEach(s => signalsListEl.appendChild(buildSignalCard(s)));
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    // --- Tab switching ---
    function setTab(tab) {
      currentTab = tab;
      tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      const onSignals = tab === 'signals';
      signalsSectionEl.hidden = !onSignals;
      newsSectionEl.hidden = onSignals;
      filtersEl.hidden = onSignals;
      sigCatFiltersEl.hidden = !onSignals;
      if (!onSignals) {
        if (allArticles.length > 0) {
          render();
        } else {
          statusEl.textContent = '載入中…';
          statusEl.hidden = false;
        }
      }
    }

    tabBtns.forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));

    // --- News filters ---
    filterBtns.forEach(btn => btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      if (cat === '全部') {
        CATEGORIES.forEach(c => selected.add(c));
      } else {
        selected.has(cat) ? selected.delete(cat) : selected.add(cat);
        if (selected.size === 0) CATEGORIES.forEach(c => selected.add(c));
      }
      updateFilterButtons();
      render();
    }));

    function updateFilterButtons() {
      const allOn = CATEGORIES.every(c => selected.has(c));
      filterBtns.forEach(btn => {
        const cat = btn.dataset.cat;
        btn.classList.toggle('active', cat === '全部' ? allOn : selected.has(cat));
      });
    }

    deselectAllBtn.addEventListener('click', () => {
      selected.clear();
      updateFilterButtons();
      render();
    });

    sigActionBtns.forEach(btn => btn.addEventListener('click', () => {
      signalActionFilter = btn.dataset.action;
      sigActionBtns.forEach(b => b.classList.toggle('active', b.dataset.action === signalActionFilter));
      renderSignals();
    }));

    function formatTime(ts) {
      if (!ts) return '';
      const diff = Math.floor(Date.now() / 1000 - ts);
      const d = new Date(ts * 1000);
      const datePart = d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
      if (diff < 60)    return '剛剛';
      if (diff < 3600)  return `${Math.floor(diff / 60)} 分鐘前 · ${datePart}`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小時前 · ${datePart}`;
      return d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      if (currentTab !== 'news') return;
      const filtered = allArticles.filter(a => selected.has(a.category));
      if (filtered.length === 0) {
        listEl.hidden = true;
        statusEl.textContent = '沒有符合條件的新聞';
        statusEl.hidden = false;
        return;
      }
      listEl.innerHTML = filtered.map(a => `
        <div class="news-item">
          <a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
          <div class="news-meta">
            <span class="badge badge-source">${a.source}</span>
            <span class="badge badge-${a.category}">${a.category}</span>
            <span class="news-time">${formatTime(a.published_ts)}</span>
          </div>
        </div>
      `).join('');
      listEl.hidden = false;
      statusEl.hidden = true;
    }

    function loadNews() {
      fetch('news.json')
        .then(r => r.json())
        .then(data => {
          allArticles = data;
          latestTs = data.length > 0 ? data[0].published_ts : 0;
          if (latestTs > 0) {
            updatedEl.textContent = `更新於 ${new Date(latestTs * 1000).toLocaleString('zh-TW')}`;
          }
          if (currentTab === 'news') render();
          else statusEl.hidden = true;
        })
        .catch(() => {
          if (currentTab === 'news') { statusEl.textContent = '載入失敗'; statusEl.hidden = false; }
        });
    }

    function loadSignals() {
      fetch('signals.json')
        .then(r => {
          if (!r.ok) throw new Error('404');
          return r.json();
        })
        .then(data => {
          if (data.generated_at) {
            signalsDate = data.generated_at;
            const d = new Date(data.generated_at);
            signalsUpdatedEl.textContent = '訊號更新於 ' + d.toLocaleString('zh-TW', {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit'
            });
          }
          allSignals = data.signals;
          buildMarketOverview(allSignals);
          renderSignals();
          signalsListEl.hidden = false;
        })
        .catch(() => {
          signalsPlaceholderEl.hidden = false;
        });
    }

    function loadScreener() {
      fetch('screen-latest.json')
        .then(r => { if (!r.ok) throw new Error('404'); return r.json(); })
        .then(data => {
          if (!data.candidates || data.candidates.length === 0) return;
          const el = document.getElementById('screener-card');
          const dateStr = data.date ? ' · ' + data.date : '';
          let rows = data.candidates.map((c, i) => `
            <div class="screener-item">
              <div class="screener-item-header">
                <span class="screener-rank">${i + 1}.</span>
                <span class="screener-ticker">${c.ticker}</span>
                <span class="screener-name">${c.name || ''}</span>
                <span class="screener-score">${c.score != null ? c.score.toFixed(1) + 'pt' : ''}</span>
              </div>
              <div class="screener-reason">${c.reason || ''}</div>
            </div>`).join('');
          el.innerHTML = `
            <div class="screener-header" onclick="var b=this.nextElementSibling;b.hidden=!b.hidden;this.querySelector('.screener-toggle').textContent=b.hidden?'▶':'▼'">
              <span class="screener-title">💡 今日低估候選${dateStr}</span>
              <span class="screener-toggle">▼</span>
            </div>
            <div class="screener-body">${rows}</div>`;
          el.hidden = false;
        })
        .catch(() => {});
    }

    function buildMarketOverview(signals) {
      const el = document.getElementById('market-overview');
      const stock = signals.filter(s => TICKER_CATEGORY[s.ticker] !== '指數');
      if (stock.length === 0) { el.hidden = true; return; }

      const counts = {BUY: 0, HOLD: 0, SELL: 0};
      stock.forEach(s => { if (s.signal in counts) counts[s.signal]++; });
      const total = stock.length;
      const bp = counts.BUY / total * 100, hp = counts.HOLD / total * 100, sp = counts.SELL / total * 100;

      const catBuy = {};
      stock.forEach(s => {
        const cat = TICKER_CATEGORY[s.ticker]; if (!cat) return;
        if (!catBuy[cat]) catBuy[cat] = {buy: 0, total: 0};
        catBuy[cat].total++;
        if (s.signal === 'BUY') catBuy[cat].buy++;
      });
      const topCats = Object.entries(catBuy)
        .filter(([, v]) => v.buy > 0)
        .sort((a, b) => b[1].buy - a[1].buy)
        .slice(0, 5);

      const vix = signals.find(s => s.ticker === '^VIX');
      const spy = signals.find(s => s.ticker === 'SPY');
      const qqq = signals.find(s => s.ticker === 'QQQ');
      const tnx = signals.find(s => s.ticker === '^TNX');
      const vixVal = vix?.fundamentals_data?.current_price;
      const tnxVal = tnx?.fundamentals_data?.current_price;
      const vixColor = vixVal == null ? '#888' : vixVal > 30 ? '#c62828' : vixVal > 20 ? '#e65100' : vixVal > 15 ? '#f57f17' : '#2e7d32';
      const sigBadge = s => s ? `<span class="mkt-sig-badge mkt-sig-${s.signal}">${s.signal}</span>` : '<span style="color:#ccc">—</span>';

      el.innerHTML = `
        <div class="mkt-title">📡 市場總覽</div>
        <div class="mkt-grid">
          <div>
            <div class="mkt-section-label">整體情緒（${total} 檔）</div>
            <div class="mkt-sentiment-bar">
              <div style="flex:${bp};background:#2e7d32;border-radius:3px 0 0 3px"></div>
              <div style="flex:${hp};background:#f57f17"></div>
              <div style="flex:${sp};background:#c62828;border-radius:0 3px 3px 0"></div>
            </div>
            <div class="mkt-sentiment-rows">
              <div class="mkt-sentiment-row"><span class="mkt-dot" style="background:#2e7d32"></span>BUY ${counts.BUY}（${bp.toFixed(0)}%）</div>
              <div class="mkt-sentiment-row"><span class="mkt-dot" style="background:#f57f17"></span>HOLD ${counts.HOLD}（${hp.toFixed(0)}%）</div>
              <div class="mkt-sentiment-row"><span class="mkt-dot" style="background:#c62828"></span>SELL ${counts.SELL}（${sp.toFixed(0)}%）</div>
            </div>
          </div>
          <div>
            <div class="mkt-section-label">大盤指標</div>
            <div class="mkt-indicator-rows">
              <div class="mkt-indicator-row"><span class="mkt-indicator-name">VIX</span><span class="mkt-indicator-value" style="color:${vixColor}">${vixVal != null ? vixVal.toFixed(1) : 'N/A'}</span></div>
              ${tnxVal != null ? `<div class="mkt-indicator-row"><span class="mkt-indicator-name">10Y殖利率</span><span class="mkt-indicator-value">${tnxVal.toFixed(2)}%</span></div>` : ''}
              <div class="mkt-indicator-row"><span class="mkt-indicator-name">SPY</span>${sigBadge(spy)}</div>
              <div class="mkt-indicator-row"><span class="mkt-indicator-name">QQQ</span>${sigBadge(qqq)}</div>
            </div>
          </div>
          <div>
            <div class="mkt-section-label">板塊熱度（BUY）</div>
            <div class="mkt-cat-rows">
              ${topCats.length > 0 ? topCats.map(([cat, v]) => `
                <div class="mkt-cat-row">
                  <span class="mkt-cat-label">${cat}</span>
                  <div class="mkt-cat-bar-bg"><div class="mkt-cat-bar-fill" style="width:${(v.buy/v.total*100).toFixed(0)}%"></div></div>
                  <span class="mkt-cat-count">${v.buy}/${v.total}</span>
                </div>`).join('') : '<div style="font-size:11px;color:#ccc">暫無 BUY 訊號</div>'}
            </div>
          </div>
        </div>`;
      el.hidden = false;
    }

    function buildSignalCard(s) {
      const card = document.createElement('div');
      card.className = 'signal-card signal-' + (s.signal || 'HOLD');

      // Summary row (always visible)
      const summaryEl = document.createElement('div');
      summaryEl.className = 'signal-summary';

      const cat = TICKER_CATEGORY[s.ticker] || '';
      if (cat) {
        const catEl = document.createElement('span');
        catEl.className = 'signal-cat';
        catEl.dataset.cat = cat;
        catEl.textContent = cat;
        summaryEl.appendChild(catEl);
      }

      const tickerEl = document.createElement('span');
      tickerEl.className = 'signal-ticker';
      tickerEl.textContent = s.ticker ?? '';
      summaryEl.appendChild(tickerEl);

      const confEl = document.createElement('span');
      confEl.className = 'signal-confidence';
      confEl.textContent = s.confidence != null ? s.confidence + '%' : '';
      summaryEl.appendChild(confEl);

      const badgeEl = document.createElement('span');
      badgeEl.className = 'signal-badge';
      badgeEl.textContent = s.signal ?? '';
      summaryEl.appendChild(badgeEl);

      card.appendChild(summaryEl);

      // Details (hidden by default, shown on hover)
      const detailsEl = document.createElement('div');
      detailsEl.className = 'signal-details';

      const ratEl = document.createElement('div');
      ratEl.className = 'signal-rationale';
      ratEl.textContent = s.rationale ?? '';
      detailsEl.appendChild(ratEl);

      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'signal-sources';
      {
        const basisEl = document.createElement('div');
        basisEl.className = 'signal-basis-tags';
        const fmt = (v, digits=1) => v != null ? (+v).toFixed(digits) : 'N/A';
        const fmtPct = v => v != null ? (v * 100).toFixed(1) + '%' : 'N/A';
        const fmtDelta = v => v != null ? (v >= 0 ? '+' : '') + (+v).toFixed(1) + '%' : 'N/A';
        const t = s.technical_data || {};
        const f = s.fundamentals_data || {};
        const uv = s.undervaluation_data || {};
        const uvItems = [];
        if (uv.upside_pct != null)         uvItems.push('目標價漲幅: ' + fmtDelta(uv.upside_pct));
        if (uv.week52_position_pct != null) uvItems.push('52週位置: ' + fmt(uv.week52_position_pct) + '%');
        if (uv.graham_number != null)       uvItems.push('Graham值: ' + fmt(uv.graham_number, 2));
        if (uv.price_vs_graham_pct != null) uvItems.push('vs Graham: ' + fmtDelta(uv.price_vs_graham_pct));
        if (uv.relative_pe != null)         uvItems.push('同業相對P/E: ' + fmt(uv.relative_pe, 2) + 'x（均值' + fmt(uv.sector_pe_avg, 0) + '）');
        const sections = [
          ['📊 技術指標', [
            'RSI: ' + fmt(t.rsi),
            'MACD: ' + fmt(t.macd_line, 2),
            'MA50: ' + fmt(t.ma50, 2),
            '成交量比: ' + fmt(t.volume_ratio, 2) + 'x',
          ]],
          ['📈 基本面', [
            '本益比: ' + fmt(f.pe_ratio),
            '預期本益比: ' + fmt(f.forward_pe),
            'P/B: ' + fmt(f.price_to_book),
            '收益成長: ' + fmtPct(f.revenue_growth),
            '利潤率: ' + fmtPct(f.profit_margin),
            '負債比: ' + fmt(f.debt_to_equity),
            ...(f.recommendation_key ? ['法人評等: ' + f.recommendation_key + (f.number_of_analyst_opinions ? ' (' + f.number_of_analyst_opinions + '人)' : '')] : []),
          ]],
        ];
        if (uvItems.length > 0) sections.push(['💹 低估指標', uvItems]);
        sections.push(['💬 社群討論', []]);
        sections.forEach(([label, items]) => {
          const sec = document.createElement('div');
          sec.className = 'signal-data-section';
          const lbl = document.createElement('div');
          lbl.className = 'signal-data-label';
          lbl.textContent = label;
          sec.appendChild(lbl);
          if (items.length > 0) {
            const vals = document.createElement('div');
            vals.className = 'signal-data-values';
            items.forEach(text => {
              const chip = document.createElement('span');
              chip.className = 'signal-data-item';
              chip.textContent = text;
              vals.appendChild(chip);
            });
            sec.appendChild(vals);
          }
          basisEl.appendChild(sec);
        });
        sourcesEl.appendChild(basisEl);
      }
      if (s.sources && s.sources.length > 0) {
        const titleEl = document.createElement('div');
        titleEl.className = 'signal-sources-title';
        titleEl.textContent = '參考新聞';
        sourcesEl.appendChild(titleEl);
        s.sources.forEach(src => {
          const row = document.createElement('div');
          row.className = 'signal-source-row';
          const a = document.createElement('a');
          a.href = src.url;
          a.textContent = src.title || src.url;
          a.target = '_blank';
          a.rel = 'noopener';
          row.appendChild(a);
          if (src.published_ts) {
            const d = new Date(src.published_ts * 1000);
            const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
            const dateEl = document.createElement('span');
            dateEl.className = 'signal-source-date';
            dateEl.textContent = dateStr;
            row.appendChild(dateEl);
          }
          sourcesEl.appendChild(row);
        });
      }
      if (s.social_posts && s.social_posts.length > 0) {
        const titleEl = document.createElement('div');
        titleEl.className = 'signal-sources-title';
        titleEl.textContent = 'Reddit 討論';
        sourcesEl.appendChild(titleEl);
        s.social_posts.forEach(p => {
          const row = document.createElement('div');
          row.className = 'signal-source-row';
          const a = document.createElement('a');
          a.href = p.url;
          a.textContent = p.title || p.url;
          a.target = '_blank';
          a.rel = 'noopener';
          row.appendChild(a);
          sourcesEl.appendChild(row);
        });
      }
      detailsEl.appendChild(sourcesEl);
      card.appendChild(detailsEl);

      if (window.matchMedia('(hover: hover)').matches) {
        card.addEventListener('mouseenter', () => card.classList.add('expanded'));
        card.addEventListener('mouseleave', () => card.classList.remove('expanded'));
      } else {
        card.addEventListener('click', () => card.classList.toggle('expanded'));
      }

      return card;
    }

    loadNews();
    loadSignals();
    loadScreener();

    const WORKER_URL = 'https://market-news-trigger.rsp93050420.workers.dev';

    function startPolling() {
      const INTERVAL = 10000;
      const TIMEOUT  = 300000;
      let elapsed = 0;
      const timer = setInterval(() => {
        elapsed += INTERVAL;
        fetch('news.json?t=' + Date.now())
          .then(r => r.json())
          .then(data => {
            const newTs = data.length > 0 ? data[0].published_ts : 0;
            if (newTs > latestTs) {
              clearInterval(timer);
              refreshBtn.classList.remove('loading');
              allArticles = data;
              latestTs = newTs;
              updatedEl.textContent = `更新於 ${new Date(newTs * 1000).toLocaleString('zh-TW')}`;
              if (currentTab === 'news') render();
              showToast('已取得最新新聞');
            } else if (elapsed >= TIMEOUT) {
              clearInterval(timer);
              refreshBtn.classList.remove('loading');
              showToast('暫無新資料，請稍後再試');
            }
          })
          .catch(() => {});
      }, INTERVAL);
    }

    refreshBtn.addEventListener('click', () => {
      const age = latestTs > 0 ? Date.now() / 1000 - latestTs : Infinity;
      if (age <= 3600) { showToast('已是最新'); return; }
      refreshBtn.classList.add('loading');
      fetch(WORKER_URL, { method: 'POST' })
        .then(r => {
          if (!r.ok) throw new Error();
          startPolling();
        })
        .catch(() => {
          refreshBtn.classList.remove('loading');
          showToast('觸發失敗，請稍後再試');
        });
    });

    function startSignalsPolling() {
      const INTERVAL = 15000;
      const TIMEOUT  = 600000;
      let elapsed = 0;
      const timer = setInterval(() => {
        elapsed += INTERVAL;
        fetch('signals.json?t=' + Date.now())
          .then(r => r.json())
          .then(data => {
            if (data.generated_at && data.generated_at !== signalsDate) {
              clearInterval(timer);
              signalsRefreshBtn.classList.remove('loading');
              signalsDate = data.generated_at;
              allSignals = data.signals;
              const d = new Date(data.generated_at);
              signalsUpdatedEl.textContent = '訊號更新於 ' + d.toLocaleString('zh-TW', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit'
              });
              buildMarketOverview(allSignals);
              if (currentTab === 'signals') renderSignals();
              showToast('已取得最新訊號');
            } else if (elapsed >= TIMEOUT) {
              clearInterval(timer);
              signalsRefreshBtn.classList.remove('loading');
              showToast('訊號仍在生成中，請稍後再試');
            }
          })
          .catch(() => {});
      }, INTERVAL);
    }

    signalsRefreshBtn.addEventListener('click', () => {
      signalsRefreshBtn.classList.add('loading');
      fetch(WORKER_URL + '/signals', { method: 'POST' })
        .then(r => {
          if (!r.ok) throw new Error();
          showToast('訊號更新中…約 5–10 分鐘後完成');
          startSignalsPolling();
        })
        .catch(() => {
          signalsRefreshBtn.classList.remove('loading');
          showToast('觸發失敗，請稍後再試');
        });
    });

    const translateBtn = document.getElementById('translate-btn');
    if (location.hostname.endsWith('.translate.goog')) {
      translateBtn.style.display = 'none';
    } else {
      translateBtn.addEventListener('click', () => {
        window.open('https://mshmwr-github-io.translate.goog/market-news/?_x_tr_sl=auto&_x_tr_tl=zh-TW&_x_tr_hl=zh-TW', '_blank');
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <button id="feedback-btn">💬 建議</button>

  <div id="feedback-overlay">
    <div id="feedback-box">
      <h3>提交建議</h3>
      <p>有任何功能建議或問題回報，都歡迎告訴我們。</p>
      <textarea id="feedback-text" placeholder="請輸入您的建議…"></textarea>
      <div class="feedback-actions">
        <button id="feedback-cancel">取消</button>
        <button id="feedback-submit">送出</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js';
    import { getFirestore, addDoc, collection, serverTimestamp }
      from 'https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js';

    const app = initializeApp({
      apiKey: 'AIzaSyA3QVtTSwTSXaMA_AbsQ863xB475OcbdmA',
      authDomain: 'ai-novel-generator-ng.firebaseapp.com',
      projectId: 'ai-novel-generator-ng',
      storageBucket: 'ai-novel-generator-ng.firebasestorage.app',
      messagingSenderId: '603430013176',
      appId: '1:603430013176:web:20f79a5819c32c689dd30d',
    });
    const db = getFirestore(app);

    const overlay  = document.getElementById('feedback-overlay');
    const textarea = document.getElementById('feedback-text');
    const submitBtn = document.getElementById('feedback-submit');

    document.getElementById('feedback-btn').addEventListener('click', () => {
      overlay.classList.add('open');
      textarea.focus();
    });
    document.getElementById('feedback-cancel').addEventListener('click', () => {
      overlay.classList.remove('open');
      textarea.value = '';
    });
    overlay.addEventListener('click', e => {
      if (e.target === overlay) { overlay.classList.remove('open'); textarea.value = ''; }
    });

    submitBtn.addEventListener('click', async () => {
      const msg = textarea.value.trim();
      if (!msg) return;
      submitBtn.disabled = true;
      submitBtn.textContent = '送出中…';
      try {
        await addDoc(collection(db, 'feedback'), {
          source: 'market-news',
          message: msg,
          created_at: serverTimestamp(),
          url: location.href,
        });
        overlay.classList.remove('open');
        textarea.value = '';
        const toast = document.getElementById('toast');
        toast.textContent = '建議已送出，謝謝！';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      } catch (err) {
        alert('送出失敗：' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '送出';
      }
    });
  </script>
</body>
</html>
