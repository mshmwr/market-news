<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日市場新聞</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d1d1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="市場新聞">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }

    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    #updated { font-size: 12px; color: #999; }
    #translate-btn {
      font-size: 12px; padding: 4px 10px; border-radius: 14px;
      border: 1.5px solid #ccc; background: #fff; cursor: pointer;
      color: #555; white-space: nowrap;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .filter-btn:hover { border-color: #888; }
    .filter-btn.active { color: #fff; border-color: transparent; }
    .filter-btn[data-cat="全部"].active       { background: #1d1d1f; }
    .filter-btn[data-cat="台股"].active       { background: #2e7d32; }
    .filter-btn[data-cat="美股"].active       { background: #1565c0; }
    .filter-btn[data-cat="加密貨幣"].active   { background: #e65100; }
    .filter-btn[data-cat="宏觀"].active       { background: #6a1b9a; }

    main { max-width: 800px; margin: 24px auto; padding: 0 16px; }

    #status { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }

    .news-list { display: flex; flex-direction: column; gap: 1px; background: #e0e0e0; border-radius: 12px; overflow: hidden; }

    .news-item { background: #fff; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
    .news-item:hover { background: #fafafa; }

    .news-item a { font-size: 15px; font-weight: 500; color: #1d1d1f; text-decoration: none; line-height: 1.4; }
    .news-item a:hover { color: #0071e3; }

    .news-meta { display: flex; gap: 8px; align-items: center; }

    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
    .badge-source   { background: #f0f0f0; color: #555; }
    .badge-台股     { background: #e8f5e9; color: #2e7d32; }
    .badge-美股     { background: #e3f2fd; color: #1565c0; }
    .badge-加密貨幣 { background: #fff3e0; color: #e65100; }
    .badge-宏觀     { background: #f3e5f5; color: #6a1b9a; }

    .news-time { font-size: 12px; color: #999; margin-left: auto; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>每日市場新聞</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="translate-btn">🌐 翻譯</button>
        <span id="updated"></span>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-cat="全部">全部</button>
      <button class="filter-btn active" data-cat="台股">台股</button>
      <button class="filter-btn active" data-cat="美股">美股</button>
      <button class="filter-btn active" data-cat="加密貨幣">加密貨幣</button>
      <button class="filter-btn active" data-cat="宏觀">宏觀</button>
    </div>
  </header>

  <main>
    <div id="status">載入中…</div>
    <div id="news-list" class="news-list" hidden></div>
  </main>

  <script>
    const CATEGORIES = ['台股', '美股', '加密貨幣', '宏觀'];
    const selected = new Set(CATEGORIES);
    let allArticles = [];

    const buttons  = document.querySelectorAll('.filter-btn');
    const listEl   = document.getElementById('news-list');
    const statusEl = document.getElementById('status');
    const updatedEl = document.getElementById('updated');

    buttons.forEach(btn => btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      if (cat === '全部') {
        CATEGORIES.forEach(c => selected.add(c));
      } else {
        selected.has(cat) ? selected.delete(cat) : selected.add(cat);
        if (selected.size === 0) CATEGORIES.forEach(c => selected.add(c));
      }
      updateButtons();
      render();
    }));

    function updateButtons() {
      const allOn = CATEGORIES.every(c => selected.has(c));
      buttons.forEach(btn => {
        const cat = btn.dataset.cat;
        btn.classList.toggle('active', cat === '全部' ? allOn : selected.has(cat));
      });
    }

    function formatTime(ts) {
      if (!ts) return '';
      const diff = Math.floor(Date.now() / 1000 - ts);
      if (diff < 60)    return '剛剛';
      if (diff < 3600)  return `${Math.floor(diff / 60)} 分鐘前`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小時前`;
      return new Date(ts * 1000).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      const filtered = allArticles.filter(a => selected.has(a.category));
      if (filtered.length === 0) {
        listEl.hidden = true;
        statusEl.textContent = '沒有符合條件的新聞';
        statusEl.hidden = false;
        return;
      }
      listEl.innerHTML = filtered.map(a => `
        <div class="news-item">
          <a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
          <div class="news-meta">
            <span class="badge badge-source">${a.source}</span>
            <span class="badge badge-${a.category}">${a.category}</span>
            <span class="news-time">${formatTime(a.published_ts)}</span>
          </div>
        </div>
      `).join('');
      listEl.hidden = false;
      statusEl.hidden = true;
    }

    fetch('news.json')
      .then(r => r.json())
      .then(data => {
        allArticles = data;
        if (data.length > 0) {
          const latest = new Date(data[0].published_ts * 1000);
          updatedEl.textContent = `更新於 ${latest.toLocaleString('zh-TW')}`;
        }
        statusEl.hidden = true;
        render();
      })
      .catch(() => {
        statusEl.textContent = '載入失敗';
      });

    document.getElementById('translate-btn').addEventListener('click', function() {
      const url = 'https://translate.google.com/translate?sl=auto&tl=zh-TW&u=' + encodeURIComponent(location.href);
      window.open(url, '_blank');
      this.style.display = 'none';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
