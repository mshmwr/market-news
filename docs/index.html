<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日市場新聞</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d1d1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="市場新聞">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }

    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; position: sticky; top: 0; z-index: 10; }
    .header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    #updated { font-size: 12px; color: #999; }
    #translate-btn {
      font-size: 12px; padding: 4px 10px; border-radius: 14px;
      border: 1.5px solid #ccc; background: #fff; cursor: pointer;
      color: #555; white-space: nowrap;
    }
    #refresh-btn {
      font-size: 12px; padding: 4px 8px; border-radius: 14px;
      border: 1.5px solid #ccc; background: #fff; cursor: pointer;
      color: #555; white-space: nowrap;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #refresh-btn.loading { pointer-events: none; opacity: .6; }
    #refresh-btn .spinner {
      display: none; width: 14px; height: 14px;
      border: 2px solid #ddd; border-top-color: #555;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle;
    }
    #refresh-btn.loading .icon { display: none; }
    #refresh-btn.loading .spinner { display: inline-block; }

    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #333; color: #fff; font-size: 13px; padding: 10px 18px;
      border-radius: 20px; opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 100; white-space: nowrap;
    }
    #toast.show { opacity: 1; }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid #ccc;
      background: #fff; font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .filter-btn:hover { border-color: #888; }
    .filter-btn.active { color: #fff; border-color: transparent; }
    .filter-btn[data-cat="全部"].active       { background: #1d1d1f; }
    .filter-btn[data-cat="台股"].active       { background: #2e7d32; }
    .filter-btn[data-cat="美股"].active       { background: #1565c0; }
    .filter-btn[data-cat="加密貨幣"].active   { background: #e65100; }
    .filter-btn[data-cat="宏觀"].active       { background: #6a1b9a; }

    main { max-width: 800px; margin: 24px auto; padding: 0 16px; }

    #status { text-align: center; color: #888; padding: 40px 0; font-size: 14px; }

    .news-list { display: flex; flex-direction: column; gap: 1px; background: #e0e0e0; border-radius: 12px; overflow: hidden; }

    .news-item { background: #fff; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
    .news-item:hover { background: #fafafa; }

    .news-item a { font-size: 15px; font-weight: 500; color: #1d1d1f; text-decoration: none; line-height: 1.4; }
    .news-item a:hover { color: #0071e3; }

    .news-meta { display: flex; gap: 8px; align-items: center; }

    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
    .badge-source   { background: #f0f0f0; color: #555; }
    .badge-台股     { background: #e8f5e9; color: #2e7d32; }
    .badge-美股     { background: #e3f2fd; color: #1565c0; }
    .badge-加密貨幣 { background: #fff3e0; color: #e65100; }
    .badge-宏觀     { background: #f3e5f5; color: #6a1b9a; }

    .news-time { font-size: 12px; color: #999; margin-left: auto; white-space: nowrap; }

    /* --- Signals section --- */
    #signals-section {
      margin-bottom: 24px;
    }
    .signals-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }
    .signals-title {
      font-size: 16px;
      font-weight: 600;
      color: #1d1d1f;
    }
    #signals-updated {
      font-size: 12px;
      color: #999;
    }
    #signals-placeholder {
      font-size: 14px;
      color: #888;
      padding: 16px 0;
    }
    .signals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    /* Signal cards */
    .signal-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      border-left: 4px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;                     /* prevent grid blowout */
    }
    .signal-BUY  { border-left-color: #2e7d32; }  /* green */
    .signal-HOLD { border-left-color: #f9a825; }  /* yellow */
    .signal-SELL { border-left-color: #c62828; }  /* red   */

    .signal-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .signal-ticker {
      font-size: 14px;
      font-weight: 600;
      color: #1d1d1f;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .signal-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .signal-BUY  .signal-badge { background: #e8f5e9; color: #2e7d32; }
    .signal-HOLD .signal-badge { background: #fff8e1; color: #f9a825; }
    .signal-SELL .signal-badge { background: #ffebee; color: #c62828; }

    .signal-confidence {
      font-size: 12px;
      color: #555;
    }
    .signal-rationale {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      /* CSS line-clamp (AC-MN002-HTML-06) */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Mobile: single column below 400px */
    @media (max-width: 400px) {
      .signals-grid {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>每日市場新聞</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="refresh-btn" title="重新整理"><span class="icon">↻</span><span class="spinner"></span></button>
        <button id="translate-btn">🌐 翻譯</button>
        <span id="updated"></span>
      </div>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-cat="全部">全部</button>
      <button class="filter-btn active" data-cat="台股">台股</button>
      <button class="filter-btn active" data-cat="美股">美股</button>
      <button class="filter-btn active" data-cat="加密貨幣">加密貨幣</button>
      <button class="filter-btn active" data-cat="宏觀">宏觀</button>
    </div>
  </header>

  <main>
    <section id="signals-section">
      <div class="signals-header">
        <h2 class="signals-title">股票訊號</h2>
        <span id="signals-updated"></span>
      </div>
      <div id="signals-list" class="signals-grid" hidden></div>
      <div id="signals-placeholder" hidden>訊號暫未生成</div>
    </section>
    <div id="status">載入中…</div>
    <div id="news-list" class="news-list" hidden></div>
  </main>
  <div id="toast"></div>

  <script>
    const CATEGORIES = ['台股', '美股', '加密貨幣', '宏觀'];
    const selected = new Set(CATEGORIES);
    let allArticles = [];
    let latestTs = 0;

    const buttons    = document.querySelectorAll('.filter-btn');
    const listEl     = document.getElementById('news-list');
    const statusEl   = document.getElementById('status');
    const updatedEl  = document.getElementById('updated');
    const refreshBtn  = document.getElementById('refresh-btn');
    const toastEl     = document.getElementById('toast');
    const signalsListEl        = document.getElementById('signals-list');
    const signalsUpdatedEl     = document.getElementById('signals-updated');
    const signalsPlaceholderEl = document.getElementById('signals-placeholder');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    buttons.forEach(btn => btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      if (cat === '全部') {
        CATEGORIES.forEach(c => selected.add(c));
      } else {
        selected.has(cat) ? selected.delete(cat) : selected.add(cat);
        if (selected.size === 0) CATEGORIES.forEach(c => selected.add(c));
      }
      updateButtons();
      render();
    }));

    function updateButtons() {
      const allOn = CATEGORIES.every(c => selected.has(c));
      buttons.forEach(btn => {
        const cat = btn.dataset.cat;
        btn.classList.toggle('active', cat === '全部' ? allOn : selected.has(cat));
      });
    }

    function formatTime(ts) {
      if (!ts) return '';
      const diff = Math.floor(Date.now() / 1000 - ts);
      const d = new Date(ts * 1000);
      const datePart = d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
      if (diff < 60)    return '剛剛';
      if (diff < 3600)  return `${Math.floor(diff / 60)} 分鐘前 · ${datePart}`;
      if (diff < 86400) return `${Math.floor(diff / 3600)} 小時前 · ${datePart}`;
      return d.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function render() {
      const filtered = allArticles.filter(a => selected.has(a.category));
      if (filtered.length === 0) {
        listEl.hidden = true;
        statusEl.textContent = '沒有符合條件的新聞';
        statusEl.hidden = false;
        return;
      }
      listEl.innerHTML = filtered.map(a => `
        <div class="news-item">
          <a href="${a.link}" target="_blank" rel="noopener">${a.title}</a>
          <div class="news-meta">
            <span class="badge badge-source">${a.source}</span>
            <span class="badge badge-${a.category}">${a.category}</span>
            <span class="news-time">${formatTime(a.published_ts)}</span>
          </div>
        </div>
      `).join('');
      listEl.hidden = false;
      statusEl.hidden = true;
    }

    function loadNews() {
      fetch('news.json')
        .then(r => r.json())
        .then(data => {
          allArticles = data;
          latestTs = data.length > 0 ? data[0].published_ts : 0;
          if (latestTs > 0) {
            updatedEl.textContent = `更新於 ${new Date(latestTs * 1000).toLocaleString('zh-TW')}`;
          }
          statusEl.hidden = true;
          render();
        })
        .catch(() => { statusEl.textContent = '載入失敗'; });
    }

    loadNews();
    loadSignals();

    function loadSignals() {
      fetch('signals.json')
        .then(r => {
          if (!r.ok) throw new Error('404');
          return r.json();
        })
        .then(data => {
          if (data.generated_at) {
            const d = new Date(data.generated_at);
            signalsUpdatedEl.textContent = '訊號更新於 ' + d.toLocaleString('zh-TW', {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit'
            });
          }
          data.signals.forEach(s => {
            const card = buildSignalCard(s);
            signalsListEl.appendChild(card);
          });
          signalsListEl.hidden = false;
        })
        .catch(() => {
          signalsPlaceholderEl.hidden = false;
        });
    }

    function buildSignalCard(s) {
      const card = document.createElement('div');
      card.className = 'signal-card signal-' + (s.signal || 'HOLD');

      const header = document.createElement('div');
      header.className = 'signal-card-header';

      const tickerEl = document.createElement('span');
      tickerEl.className = 'signal-ticker';
      tickerEl.textContent = s.ticker ?? '';

      const badgeEl = document.createElement('span');
      badgeEl.className = 'signal-badge';
      badgeEl.textContent = s.signal ?? '';

      header.appendChild(tickerEl);
      header.appendChild(badgeEl);

      const confEl = document.createElement('div');
      confEl.className = 'signal-confidence';
      confEl.textContent = s.confidence != null ? '信心度 ' + s.confidence + '%' : '';

      const ratEl = document.createElement('div');
      ratEl.className = 'signal-rationale';
      ratEl.textContent = s.rationale ?? '';

      card.appendChild(header);
      card.appendChild(confEl);
      card.appendChild(ratEl);
      return card;
    }

    const WORKER_URL = 'https://market-news-trigger.rsp93050420.workers.dev';

    function startPolling() {
      const INTERVAL = 10000;
      const TIMEOUT  = 300000;
      let elapsed = 0;
      const timer = setInterval(() => {
        elapsed += INTERVAL;
        fetch('news.json?t=' + Date.now())
          .then(r => r.json())
          .then(data => {
            const newTs = data.length > 0 ? data[0].published_ts : 0;
            if (newTs > latestTs) {
              clearInterval(timer);
              refreshBtn.classList.remove('loading');
              allArticles = data;
              latestTs = newTs;
              updatedEl.textContent = `更新於 ${new Date(newTs * 1000).toLocaleString('zh-TW')}`;
              render();
              showToast('已取得最新新聞');
            } else if (elapsed >= TIMEOUT) {
              clearInterval(timer);
              refreshBtn.classList.remove('loading');
              showToast('暫無新資料，請稍後再試');
            }
          })
          .catch(() => {});
      }, INTERVAL);
    }

    refreshBtn.addEventListener('click', () => {
      const age = latestTs > 0 ? Date.now() / 1000 - latestTs : Infinity;
      if (age <= 3600) { showToast('已是最新'); return; }
      refreshBtn.classList.add('loading');
      fetch(WORKER_URL, { method: 'POST' })
        .then(r => {
          if (!r.ok) throw new Error();
          startPolling();
        })
        .catch(() => {
          refreshBtn.classList.remove('loading');
          showToast('觸發失敗，請稍後再試');
        });
    });

    const translateBtn = document.getElementById('translate-btn');
    if (location.hostname.endsWith('.translate.goog')) {
      translateBtn.style.display = 'none';
    } else {
      translateBtn.addEventListener('click', () => {
        window.open('https://mshmwr-github-io.translate.goog/market-news/?_x_tr_sl=auto&_x_tr_tl=zh-TW&_x_tr_hl=zh-TW', '_blank');
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
